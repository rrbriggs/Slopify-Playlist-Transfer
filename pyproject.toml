[project]
name = "playlist-transfer"
version = "0.1.0"
description = "Transfer and sync playlists, liked tracks, albums and artists between Spotify and Qobuz, with a reviewable diff."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
playlist-transfer = "playlist_transfer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["playlist_transfer", "playlist_transfer.providers"]

[tool.setuptools.package-data]
playlist_transfer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
